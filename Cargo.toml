[package]
name = "pop-launcher-remmina-quick-connect"
version = "1.0.0"
edition = "2024"
description = "pop-launcher plugin to search and open saved Remmina connections"
repository = "https://github.com/Silureth/pop-launcher-remmina-quick-connect"
license = "MIT"

[[bin]]
name = "remmina-quick-connect"
path = "src/main.rs"

[dependencies]
nucleo-matcher = "0.3"
pop-launcher = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
